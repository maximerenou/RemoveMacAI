name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build
        run: swift build -c release --arch arm64
      - name: Self-test
        run: "$(swift build -c release --arch arm64 --show-bin-path)/removemacai selftest"
      - name: App bundle
        run: tools/build-app.sh
